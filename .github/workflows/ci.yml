name: Build & Release PIA Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build NDK & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Test Rust NDK Core
        working-directory: core-native
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Compile Rust JNI Shared Libraries (.so)
        working-directory: core-native
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../app/src/main/jniLibs/x86_64
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/*.apk release-output/PIA-Terminal-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIA-Terminal-release-apk
          path: release-output/PIA-Terminal-release.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/PIA-Terminal-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
