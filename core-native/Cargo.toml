[package]
name = "pia-mobile-core"
version = "0.1.0"
edition = "2021"
authors = ["wignn"]
description = "High performance market tick conflation and indicator core for PIA Android"

[lib]
name = "pia_mobile_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
